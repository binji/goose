# Builds the documentation site from the repository's markdown with pandoc
# (docs/site/build.py) on every push to master and publishes it with the
# GitHub Pages actions. The repository's Pages source must be set to
# "GitHub Actions" for the deploy step to be allowed (docs/site/README.md).
# Run by hand (workflow_dispatch), it builds and checks the site the same
# way and deploys it too.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The playground (docs/site/play) runs the compiler built to
      # WebAssembly (docs/design/interpreter.md section 8): wasi-sdk's
      # clang, which the toolchain file fetches (--fetch), and node to check
      # the module before the page ships with it. The site build leaves the
      # page out where the module is missing, so a failure here is a missing
      # playground, not a broken site.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the compiler to WebAssembly and check it
        run: |
          sudo apt-get install -y ninja-build
          python test/wasm_build.py --fetch
          node --no-warnings docs/site/play/wasi_test.mjs build/wasm/goose.wasm

      # A pinned pandoc rather than the distribution's, so that the build
      # here and on a developer's machine agree on the HTML.
      - name: Install pandoc
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc-3.6.4-1-amd64.deb
          pandoc --version | head -1

      - name: Build and check the site
        run: python docs/site/build.py --out build/site --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
